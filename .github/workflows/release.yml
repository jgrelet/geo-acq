name: Release

on:
  push:
    tags:
      - "*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          mkdir -p dist
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          go build \
            -trimpath \
            -ldflags="-s -w -X main.appVersion=${VERSION#v}" \
            -o "dist/geo-acq-${GOOS}-${GOARCH}${ext}" \
            ./cmd/geo-acq

      - name: Upload CLI workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-acq-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/geo-acq-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  build-gui:
    name: Build GUI ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runs_on: ubuntu-latest
            wails_tags: "-tags webkit2_41"
          - goos: linux
            goarch: arm64
            runs_on: ubuntu-24.04-arm
            wails_tags: "-tags webkit2_41"
          - goos: windows
            goarch: amd64
            runs_on: windows-latest
            wails_tags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux GUI dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build GUI binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          WAILS_TAGS: ${{ matrix.wails_tags }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          wails build -clean -trimpath -ldflags "-X main.appVersion=${VERSION#v}" ${WAILS_TAGS}
          mkdir -p dist
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          cp "build/bin/geo-acq-gui${ext}" "dist/geo-acq-gui-${GOOS}-${GOARCH}${ext}"

      - name: Upload GUI workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-acq-gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/geo-acq-gui-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - build-cli
      - build-gui

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: geo-acq*
          merge-multiple: true

      - name: Publish assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
